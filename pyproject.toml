[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmmrpc"
version = "0.1.0"
description = "Userspace RPC control for Intel XMM7360 (Fibocom L850-GL) modems driven by the in-tree iosm driver"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0 OR BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["xmm7360", "iosm", "wwan", "lte", "fibocom", "l850"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = [
  "configargparse",
  "pyroute2",
]

[project.optional-dependencies]
dev = [
  "black",
  "pytest",
  "ruff",
]

[project.scripts]
xmmrpc = "xmmrpc.cli:main"

[project.urls]
Homepage = "https://github.com/serephus/xmmrpc"
Source = "https://github.com/serephus/xmmrpc"

[tool.hatch.build.targets.wheel]
packages = ["src/xmmrpc"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 is handled by black, which cannot split long string literals.
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
